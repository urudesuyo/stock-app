    html {

}

body {

}

    }
    .category-buttons {
  display: flex;

  margin: 15px 0;
}

.category-buttons button {
    padding: 14px 32px;
border: none;
border-radius: 30px;
background: #e0e0e0;
font-size: 17px;
font-weight: 700;
}

.category-buttons button.active {
  background: #d8f0d8;
}
#dailyButton.active {

}
.lists-container {

    grid-template-columns: 1fr 1fr;

}
.list-column {

#addButton {

-webkit-user-select: none;
-webkit-touch-callout: none;

    .item-name {

    .have {

  left: 0;

  height: 72px;

/* 価格比較画面 */
#compareScreen {
  padding-bottom: 190px;
}

#compareScreen h1 {
  font-size: 28px;
  margin: 15px 0 20px;
}

.compare-cards {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.compare-card {
  background: white;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 2px 5px rgba(0,0,0,0.08);
}

.compare-card h2 {
  background: #dfa05c;
  color: white;
  text-align: center;
  margin: 0;
  padding: 5px 4px;
  font-size: 17px;
}

.compare-card label {
  display: block;
  background: #f8e8d8;
  color: #806b5c;
  margin: 4px 5px 0;
  padding: 3px 5px;
  font-size: 11px;
}

.compare-card input {
  width: calc(100% - 10px);
  box-sizing: border-box;
  margin: 2px 5px 4px;
  padding: 3px;
  border: none;
  background: white;
  text-align: center;
  font-size: 17px;
  font-weight: 700;
}

.compare-count {
  display: flex;
  width: 70%;
  position: fixed;
  left: 15%;
  bottom: 90px;
  margin: 0;
  background: white;
  border-radius: 30px;
  overflow: hidden;
  z-index: 900;
}
#compareResult:empty {
  display: none;
}

#compareResult {
  margin: 10px auto;
  width: 88%;

  background: white;
  border-radius: 16px;
  padding: 10px 12px;
  text-align: center;
  font-size: 15px;
  line-height: 1.25;
  box-shadow: 0 3px 8px rgba(0,0,0,0.08);
}

#unitScreen {
  padding-bottom: 120px;
}

#unitScreen h1 {
  font-size: 28px;
  text-align: center;
  margin: 30px 0 35px;
}

.unit-card {
  width: 90%;
  max-width: 500px;
  margin: 0 auto;
  background: white;
  border-radius: 16px;
  padding: 20px;

}

.unit-card label {

.unit-arrow {
  text-align: center;
  font-size: 30px;
  margin: 15px 0;
}

.unit-result {

}

.unit-result .result-box {
  background: white;
  padding: 35px 20px;
  text-align: center;
  font-size: 24px;
  font-weight: 700;
  border-radius: 16px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.08);
}

.unit-result .result-box strong {
  font-size: 38px;
}
.compare-count button {
  flex: 1;
  border-radius: 0;
  padding: 10px;
  background: white;
  font-size: 20px;
  font-weight: 700;
}

.compare-count button.active {

#discountScreen {

}

.discount-card {

}

.discount-card input {

.discount-arrow {

#discountResult {

#discountResult .result-box {

}
.result-box strong {

}
.off-price {

.calculator {
  width: 95%;
  margin: 0 auto;
  padding-bottom: 20px;

}

.calculator-display {
  background: #fff8e7;
  font-size: 48px;
  text-align: right;
  padding: 20px;

  height: 100px;
}

.calculator-buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);

.calculator-buttons button {

  font-size: 30px;

.calc-number {
  background: #d9a875;

}

.calc-light {
  background: #eeeae2;

}

.calc-operator {
  background: #eeeae2;
  color: #8b6f5b;
}

.calc-equal {
  background: #d9a875;
  color: white;
}

.calc-zero {
  grid-column: span 2;

let swipeStartX = 0;

function startSwipe(event) {
  swipeStartX = event.touches[0].clientX;
}

function endSwipe(event) {
  const swipeEndX = event.changedTouches[0].clientX;
  const swipeDistance = swipeEndX - swipeStartX;

  const memoItem = event.currentTarget;
  const memoContent = memoItem.querySelector(".memo-content");
  const deleteButton = memoItem.querySelector(".memo-delete-button");

  if (swipeDistance < -80) {
    if (memoContent.style.transform === "translateX(-80px)") {
      const memoIndex = Array.from(document.querySelectorAll(".memo-item")).indexOf(memoItem);
      deleteMemo(memoIndex);
    } else {
      memoContent.style.transform = "translateX(-80px)";
      deleteButton.style.display = "block";
    }
  } else if (swipeDistance > 80) {
    memoContent.style.transform = "translateX(0)";
    deleteButton.style.display = "none";
  }
}

  function calculateCompare() {
  const products = ["A", "B", "C", "D"];
  const results = [];

  products.forEach(name => {
    const price = Number(document.getElementById("price" + name)?.value);
    const amount = Number(document.getElementById("amount" + name)?.value);
    const pack = Number(document.getElementById("pack" + name)?.value);

    if (price > 0 && amount > 0 && pack > 0) {
      const totalAmount = amount * pack;
      const unitPrice = price / totalAmount;

      results.push({
        name: name,
        price: price,
        totalAmount: totalAmount,
        unitPrice: unitPrice
      });
    }
  });

  const resultArea = document.getElementById("compareResult");

  if (results.length < 2) {
    resultArea.innerHTML = "";
    return;
  }

  results.sort((a, b) => a.unitPrice - b.unitPrice);

  const winner = results[0];
  const second = results[1];

  const savings = Math.round(
    second.unitPrice * winner.totalAmount - winner.price
  );

  resultArea.innerHTML = `
  <div>
    <strong>商品${winner.name}が一番お得！</strong>
    <br>
    <strong>${savings}円分節約できます</strong>
    <br>
    （商品${second.name}と同じ量で比較）
    <br>
    ${results.map(product =>
      `商品${product.name}：1単位あたり ${product.unitPrice.toFixed(3)}円`
    ).join("<br>")}
  </div>
`;
}
["A", "B", "C", "D"].forEach(name => {
  document.getElementById("price" + name).addEventListener("input", calculateCompare);
  document.getElementById("amount" + name).addEventListener("input", calculateCompare);
  document.getElementById("pack" + name).addEventListener("input", calculateCompare);
});

  }

  const discountPrice = price * rate;

`;

resultBox.style.display = "block";
}
